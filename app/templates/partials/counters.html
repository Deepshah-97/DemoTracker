<div id="counters" class="grid grid-cols-2 md:grid-cols-4 gap-3" hx-get="/partials/counters" hx-trigger="sse:tasks" hx-swap="outerHTML">
  {% for key, label, href in [("waiting", "Tasks waiting", "/tasks"), ("drafts", "Drafts pending", "/drafts"), ("sent", "Follow-ups sent", "/tasks"), ("replied", "Clients replied", "/tasks")] %}
    <a href="{{ href }}" class="card p-4 hover:border-slate-400">
      <div class="text-3xl font-semibold text-slate-900">{{ counters[key] }}</div>
      <div class="text-sm text-slate-500 mt-1">{{ label }}</div>
    </a>
  {% endfor %}
</div>
