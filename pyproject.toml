[project]
name = "followup-demo-dashboard"
version = "0.1.0"
description = "Demo dashboard for the Follow-Up Agent API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "sse-starlette>=3.6.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-timeout>=2.4.0",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
